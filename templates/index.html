<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magical Story Generator for Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* General Styling */
        body {
            font-family: 'Poppins', sans-serif;
            background-image: url('data:image/svg+xml,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><path d="M30 5L35 15L45 20L35 25L30 35L25 25L15 20L25 15L30 5Z" fill="%23dbeafe" fill-opacity="0.4"/></svg>');
            background-color: #f9f9f9;
            color: #2c3e50;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
            font-size: 2.8em;
            font-weight: 600;
        }

        .intro-text {
            text-align: center;
            font-size: 1.2em;
            color: #4b5563;
            margin-bottom: 30px;
        }

        /* Upload Section Styling */
        .upload-section {
            border: 2px dashed #2563eb;
            border-radius: 15px;
            padding: 40px;
            background-color: #eef2ff;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .upload-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
        }

        .upload-section label {
            font-size: 1.3em;
            font-weight: 600;
            color: #2563eb;
            display: block;
            cursor: pointer;
        }

        .upload-section span {
            font-size: 2.5em;
            display: block;
            margin-bottom: 10px;
            color: #2563eb;
        }

        input[type="file"] {
            display: none;
        }

        /* Genre Section */
        .genre-section {
            margin-top: 20px;
            text-align: center;
        }

        select {
            padding: 12px 20px;
            font-size: 1em;
            border-radius: 10px;
            border: 2px solid #2563eb;
            background-color: white;
            cursor: pointer;
            color: #2c3e50;
            font-family: 'Poppins', sans-serif;
            width: 100%;
            max-width: 300px;
        }

        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 5px rgba(59, 130, 246, 0.5);
        }

        /* Button */
        button {
            background-color: #2563eb;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            margin: 20px auto;
            display: block;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8;
            transform: scale(1.05);
        }

        /* Story Section */
        .story-section {
            margin-top: 30px;
        }

        .story {
            background-color: #fef3c7;
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #facc15;
            font-size: 1.1em;
            line-height: 1.6;
            box-shadow: 0 4px 12px rgba(250, 204, 21, 0.2);
        }

        /* Image Styling */
        .uploaded-image,
        .processed-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin: 20px 0;
        }

        .uploaded-image {
            border: 3px solid #2563eb;
            padding: 10px;
            background-color: #eef2ff;
            box-shadow: 0 6px 12px rgba(37, 99, 235, 0.2);
        }

        .processed-image {
            border: 3px dashed #facc15;
            padding: 15px;
            background-color: #fef3c7;
            box-shadow: 0 6px 12px rgba(250, 204, 21, 0.3);
            transform: scale(1.05);
        }

        /* Loader Styling */
        .loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: none; /* Hidden by default */
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #2563eb;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* Message Styling */
        .upload-message {
            font-size: 1.2em;
            color: #28a745;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✨ Magical Story Generator ✨</h1>
    <p class="intro-text">Upload an image and let us create an enchanting story just for you! 🪄📖</p>

    <form id="story-form">
        <div class="upload-section">
            <label for="file-upload">
                <span>📸</span>
                Click or Drag to Upload Your Image
            </label>
            <input id="file-upload" type="file" name="file" accept="image/*" required>
        </div>

        <div id="upload-message" class="upload-message" style="display:none;">
            Photo uploaded
        </div>

        <div id="upload-preview" style="display:none; text-align:center;">
            <img id="preview-image" class="uploaded-image" alt="Uploaded Picture">
        </div>

        <div class="genre-section">
            <label for="genre"><strong>Pick Your Story Type:</strong></label>
            <select id="genre" name="genre" required>
                <option value="Moral">Magical Moral Tale</option>
                <option value="Comedy">Funny Adventure</option>
                <option value="Adventure">Epic Quest</option>
                <option value="Fantasy">Enchanted Fantasy</option>
                <option value="Mystery">Curious Mystery</option>
            </select>
        </div>

        <button id="generate-button" type="submit" disabled>
            ✨ Create My Story! ✨
        </button>
    </form>

    <div id="error-message" class="upload-message"
         style="display:none; color:#dc2626;"></div>

    <div id="story-result" style="display:none;">
        <div class="story-section">
            <h3 id="story-title">Your Story 📖</h3>
            <div class="story">
                <p id="story-text"></p>
            </div>
        </div>

        <div class="audio-section" style="margin-top:20px;">
            <h3>Listen to Your Story 🎧</h3>
            <audio id="story-audio" controls>
                <source id="audio-source" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <p>
                <a id="audio-download" href="#" download>
                    📥 Download Audio
                </a>
            </p>
        </div>
    </div>
</div>

<!-- Loader -->
<div class="loader-wrapper" id="loader-wrapper">
    <div class="loader"></div>
</div>

<script>
    const fileInput = document.getElementById("file-upload");
    const uploadMessage = document.getElementById("upload-message");
    const uploadPreview = document.getElementById("upload-preview");
    const previewImage = document.getElementById("preview-image");
    const generateButton = document.getElementById("generate-button");
    const storyForm = document.getElementById("story-form");
    const loader = document.getElementById("loader-wrapper");
    const errorMessage = document.getElementById("error-message");
    const storyResult = document.getElementById("story-result");
    const storyTitle = document.getElementById("story-title");
    const storyText = document.getElementById("story-text");
    const storyAudio = document.getElementById("story-audio");
    const audioSource = document.getElementById("audio-source");
    const audioDownload = document.getElementById("audio-download");

    // STEP 1: Selecting a photo uploads it immediately.
    // It does NOT call Gemini and does NOT generate a story.
    fileInput.addEventListener("change", async function () {
        const file = this.files[0];

        if (!file) return;

        uploadMessage.style.display = "none";
        errorMessage.style.display = "none";
        generateButton.disabled = true;

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || "Upload failed.");
            }

            // Show the uploaded photo and confirmation without refreshing.
            previewImage.src = data.image_url;
            uploadPreview.style.display = "block";
            uploadMessage.textContent = "Photo uploaded ✓";
            uploadMessage.style.display = "block";

            // Now the user can select genre and click Generate.
            generateButton.disabled = false;

        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.style.display = "block";
            uploadPreview.style.display = "none";
            generateButton.disabled = true;
        }
    });

    // STEP 2: Generate the story only when the Generate button is clicked.
    storyForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const genre = document.getElementById("genre").value;

        errorMessage.style.display = "none";
        storyResult.style.display = "none";
        loader.style.display = "flex";
        generateButton.disabled = true;
        generateButton.textContent = "✨ Creating your story... ✨";

        const formData = new FormData();
        formData.append("genre", genre);

        try {
            const response = await fetch("/generate", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(data.error || "Story generation failed.");
            }

            storyTitle.textContent = `Your ${data.genre} Story 📖`;
            storyText.textContent = data.story;

            audioSource.src = data.audio_url;
            storyAudio.load();
            audioDownload.href = data.audio_url;

            storyResult.style.display = "block";
            storyResult.scrollIntoView({ behavior: "smooth", block: "start" });

        } catch (error) {
            errorMessage.textContent = error.message;
            errorMessage.style.display = "block";
        } finally {
            loader.style.display = "none";
            generateButton.disabled = false;
            generateButton.textContent = "✨ Create My Story! ✨";
        }
    });
</script>

</body>
</html>
